name: flutter_proximiio
description: Flutter plugin for Proximiio indoor positioning with support for beacons, geofencing, and floor detection
version: 1.0.0
homepage: https://github.com/proximiio/flutter-proximiio

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.proximi.flutter_proximiio
        pluginClass: FlutterProximiioPlugin
      ios:
        pluginClass: FlutterProximiioPlugin
