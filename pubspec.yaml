name: flutter_proximiio
description: Proximi.io indoor positioning for Flutter, a bridge over the native Proximi.io SDK v6 for iOS and Android.
version: 6.0.0-beta.7
homepage: https://github.com/proximiio/flutter-proximiio

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.3.4

flutter:
  plugin:
    platforms:
      android:
        package: io.proximi.flutter_proximiio
        pluginClass: FlutterProximiioPlugin
      ios:
        pluginClass: FlutterProximiioPlugin
